name: ${project.name}
version: ${project.version}
main: dev.pupwired.courier.CourierPlugin
api-version: '26.3'
description: Localized, channel-based roleplay chat.

depend:
  - LuckPerms
  - LuckyLib

permissions:
  courier.channel.global.read: { default: true }
  courier.channel.global.write: { default: true }
  courier.channel.yell.read: { default: true }
  courier.channel.yell.write: { default: true }
  courier.channel.say.read: { default: true }
  courier.channel.say.write: { default: true }
  courier.channel.mumble.read: { default: true }
  courier.channel.mumble.write: { default: true }
  courier.channel.whisper.read: { default: true }
  courier.channel.whisper.write: { default: true }