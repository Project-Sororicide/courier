name: ${project.name}
version: ${project.version}
main: dev.pupwired.courier.CourierPlugin
api-version: '26.3'
description: Localized, channel-based roleplay chat.

depend:
  - LuckPerms
  - LuckyLib

commands:
  courier:
    description: Courier admin command
    usage: /courier reload
    permission: courier.admin

permissions:
  courier.admin:
    description: Courier admin permission
    default: op